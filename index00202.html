<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 분양 종합 성찰일지</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; padding: 20px; min-height: 100vh; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 600px; border-top: 8px solid #4285f4; }
        h2 { color: #202124; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #3c4043; font-size: 15px; }
        .sub-label { display: block; font-size: 12px; color: #1a73e8; margin-bottom: 8px; font-weight: normal; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .tabs { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #dadce0; padding-bottom: 5px; }
        .tab-btn { background: none; border: none; padding: 10px; font-size: 14px; font-weight: bold; color: #70757a; cursor: pointer; }
        .tab-btn.active { color: #4285f4; border-bottom: 3px solid #4285f4; }
        .tab-content { display: none; background: #f1f3f4; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .tab-content.active { display: block; }

        button.submit-btn { width: 100%; padding: 15px; background-color: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button.submit-btn:hover { background-color: #174ea6; }
        button:disabled { background-color: #bdc1c6; cursor: not-allowed; }
        
        /* 업로드 상태 표시 바 */
        #progressContainer { display: none; margin-top: 15px; background: #e8eaed; border-radius: 10px; height: 20px; overflow: hidden; }
        #progressBar { background: #1a73e8; width: 0%; height: 100%; transition: width 0.2s; text-align: center; color: white; font-size: 12px; line-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 게시판 분양 종합 성찰일지 (1~5회)</h2>
    
    <form id="megaForm">
        <div class="form-group">
            <label>학번 및 이름</label>
            <input type="text" name="student_info" placeholder="예: 20101 홍길동" required>
        </div>

        <div class="form-group">
            <label>분양 구역 선택</label>
            <select name="zone" required>
                <option value="" disabled selected>본인의 구역을 선택하세요</option>
                <option value="공유지 쉼터">공유지 쉼터</option>
                <option value="러닝허브">러닝허브</option>
                <option value="싱크탱크">싱크탱크</option>
                <option value="월드와이드">월드와이드</option>
                <option value="인사이트 서재">인사이트 서재</option>
                <option value="커리어캔버스">커리어캔버스</option>
                <option value="아고라">아고라</option>
            </select>
        </div>

        <div class="tabs">
            <button type="button" class="tab-btn active" onclick="openTab(event, 'tab1')">1회차</button>
            <button type="button" class="tab-btn" onclick="openTab(event, 'tab2')">2회차</button>
            <button type="button" class="tab-btn" onclick="openTab(event, 'tab3')">3회차</button>
            <button type="button" class="tab-btn" onclick="openTab(event, 'tab4')">4회차</button>
            <button type="button" class="tab-btn" onclick="openTab(event, 'tab5')">5회차</button>
        </div>

        <!-- 1~5회차 입력란 (생략 없이 통합 유지) -->
        <div id="tab1" class="tab-content active">
            <h4>[ 1회차 기록 ]</h4>
            <div class="form-group">
                <span class="sub-label">💡 무엇을 했는가?</span>
                <input type="text" name="activity_1" placeholder="1회차 활동 내용">
                <span class="sub-label" style="margin-top:10px;">💡 무엇을 느꼈거나 배웠는가?</span>
                <textarea name="reflection_1" rows="3" placeholder="1회차 성찰 내용"></textarea>
            </div>
        </div>

        <div id="tab2" class="tab-content">
            <h4>[ 2회차 기록 ]</h4>
            <div class="form-group">
                <span class="sub-label">💡 무엇을 했는가?</span>
                <input type="text" name="activity_2" placeholder="2회차 활동 내용">
                <span class="sub-label" style="margin-top:10px;">💡 무엇을 느꼈거나 배웠는가?</span>
                <textarea name="reflection_2" rows="3" placeholder="2회차 성찰 내용"></textarea>
            </div>
        </div>

        <div id="tab3" class="tab-content">
            <h4>[ 3회차 기록 ]</h4>
            <div class="form-group">
                <span class="sub-label">💡 무엇을 했는가?</span>
                <input type="text" name="activity_3" placeholder="3회차 활동 내용">
                <span class="sub-label" style="margin-top:10px;">💡 무엇을 느꼈거나 배웠는가?</span>
                <textarea name="reflection_3" rows="3" placeholder="3회차 성찰 내용"></textarea>
            </div>
        </div>

        <div id="tab4" class="tab-content">
            <h4>[ 4회차 기록 ]</h4>
            <div class="form-group">
                <span class="sub-label">💡 무엇을 했는가?</span>
                <input type="text" name="activity_4" placeholder="4회차 활동 내용">
                <span class="sub-label" style="margin-top:10px;">💡 무엇을 느꼈거나 배웠는가?</span>
                <textarea name="reflection_4" rows="3" placeholder="4회차 성찰 내용"></textarea>
            </div>
        </div>

        <div id="tab5" class="tab-content">
            <h4>[ 5회차 기록 ]</h4>
            <div class="form-group">
                <span class="sub-label">💡 무엇을 했는가?</span>
                <input type="text" name="activity_5" placeholder="5회차 활동 내용">
                <span class="sub-label" style="margin-top:10px;">💡 무엇을 느꼈거나 배웠는가?</span>
                <textarea name="reflection_5" rows="3" placeholder="5회차 성찰 내용"></textarea>
            </div>
        </div>

        <div class="form-group">
            <label>활동 증빙 파일 첨부 (최대 용량 가능)</label>
            <input type="file" id="inputFile">
        </div>

        <div id="progressContainer"><div id="progressBar">0%</div></div>

        <button type="submit" class="submit-btn" id="submitBtn">모든 차시 제출하기</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyfkJb809akz5Mf6BKWx3rSBPQT--PX62x32dTMk-XilaAW82XYWS46QXnQAUFXb5CG-w/exec'; // <--- 여기에 본인의 웹 앱 URL을 넣으세요.

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) { tablinks[i].className = tablinks[i].className.replace(" active", ""); }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
    }

    const form = document.getElementById('megaForm');
    const btn = document.getElementById('submitBtn');
    const pContainer = document.getElementById('progressContainer');
    const pBar = document.getElementById('progressBar');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = '데이터 등록 중...';

        const fileInput = document.getElementById('inputFile');
        const formData = new FormData(form);
        const searchParams = new URLSearchParams();
        
        for (const pair of formData.entries()) {
            searchParams.append(pair[0], pair[1]);
        }
        searchParams.append('chunkIndex', '0'); // 첫 데이터 등록 신호

        // 1단계: 구글 시트에 기본 텍스트 데이터 먼저 전송하여 행(Row) 확보
        fetch(scriptURL, { method: 'POST', body: searchParams })
        .then(res => res.json())
        .then(resData => {
            if(resData.row) {
                if (fileInput.files.length > 0) {
                    // 파일이 있으면 분할 업로드 시작
                    uploadFileChunks(fileInput.files[0], resData.row);
                } else {
                    alert('성찰일지가 성공적으로 제출되었습니다! (첨부파일 없음)');
                    finishSubmit();
                }
            } else {
                alert('등록 오류가 발생했습니다. 다시 시도해 주세요.');
                resetBtn();
            }
        })
        .catch(err => {
            console.error(err);
            alert('서버 연결 실패. URL을 다시 확인해 주세요.');
            resetBtn();
        });
    });

    // 파일을 안전한 크기로 쪼개서 순차 전송하는 함수
    function uploadFileChunks(file, targetRow) {
        pContainer.style.display = 'block';
        btn.innerText = '대용량 파일 전송 중...';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result;
            
            // 안전하게 약 1MB 단위로 조각(Chunk) 생성
            const chunkSize = 1024 * 1024; 
            const totalChunks = Math.ceil(base64Data.length / chunkSize);
            let currentChunk = 0;

            function sendNextChunk() {
                const start = currentChunk * chunkSize;
                const end = Math.min(start + chunkSize, base64Data.length);
                const chunk = base64Data.substring(start, end);

                const params = new URLSearchParams();
                params.append('status', 'APPENDING');
                params.append('targetRow', targetRow);
                params.append('fileName', file.name);
                params.append('fileType', file.type);
                
                // 마지막 조각일 때 전체 결합 신호와 데이터를 함께 보냄
                const isFinal = (currentChunk === totalChunks - 1);
                params.append('isFinal', isFinal ? 'true' : 'false');
                if (isFinal) {
                    params.append('allData', base64Data); 
                }

                // 진행률 표시
                const percent = Math.round(((currentChunk + 1) / totalChunks) * 100);
                pBar.style.width = percent + '%';
                pBar.innerText = percent + '%';

                fetch(scriptURL, { method: 'POST', body: params })
                .then(res => res.json())
                .then(result => {
                    if (isFinal && result.status === 'SUCCESS') {
                        alert('대용량 파일과 성찰일지가 완벽하게 저장되었습니다!');
                        finishSubmit();
                    } else {
                        currentChunk++;
                        if (currentChunk < totalChunks) {
                            sendNextChunk();
                        }
                    }
                })
                .catch(err => {
                    alert('파일 전송 중 오류가 발생했습니다. 파일 용량을 조금만 줄여보세요.');
                    resetBtn();
                });
            }
            sendNextChunk();
        };
        reader.readAsDataURL(file);
    }

    function finishSubmit() {
        form.reset();
        resetBtn();
        pContainer.style.display = 'none';
        pBar.style.width = '0%';
    }

    function resetBtn() {
        btn.disabled = false;
        btn.innerText = '모든 차시 제출하기';
    }
</script>

</body>
</html>
