<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 교과 후속 활동 제출</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --background-color: #f4f6f9;
            --card-color: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
        }

        header p {
            color: #666;
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }

        label span {
            color: #e74c3c;
            margin-left: 3px;
        }

        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 111, 165, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-note {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
            display: block;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #365885;
        }

        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* 로딩 애니메이션 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(25, 25, 25, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">제출 중입니다. 잠시만 기다려주세요...</div>

<div class="container">
    <header>
        <h1>정보 교과 후속 활동 제출 시스템</h1>
        <p>웹툰 연계 활동 내용 입력 및 파일(알고리즘/코드)을 제출해주세요.</p>
    </header>

    <form id="activityForm" onsubmit="handleSubmit(event)">
        <!-- 1. 기본 인적 사항 -->
        <div class="form-row">
            <div class="form-group">
                <label for="studentInfo">학번 / 이름<span>*</span></label>
                <input type="text" id="studentInfo" placeholder="예: 20101 홍길동" required>
            </div>
            <div class="form-group">
                <label for="career">희망 진로<span>*</span></label>
                <input type="text" id="career" placeholder="예: 데이터 분석가, 소프트웨어 개발자" required>
            </div>
        </div>

        <hr style="border: 0; height: 1px; background: #eee; margin: 25px 0;">

        <!-- 2. 웹툰 줄거리 (수정된 부분) -->
        <div class="form-group">
            <label for="webtoonSummary">작성한 웹툰 및 줄거리 요약<span>*</span></label>
            <textarea id="webtoonSummary" placeholder="웹툰 제목과 주요 스토리 라인을 간략하게 요약하여 작성하세요." required></textarea>
        </div>

        <!-- 3. 문제 정의 -->
        <div class="form-group">
            <label for="problemDefinition">웹툰 속 문제 상황 (또는 연계 신문기사 문제 제시)<span>*</span></label>
            <textarea id="problemDefinition" placeholder="웹툰 내에서 해결하고 싶은 문제 또는 관련 신문기사 속 문제를 정의해주세요(코드화하고 싶은 문제 찾기)." required></textarea>
        </div>

        <!-- 4. 대용량 파일 첨부 (알고리즘 및 코드) -->
        <div class="form-group">
            <label for="fileAttachment">알고리즘 설계 및 소스 코드 파일 제출<span>*</span></label>
            <input type="file" id="fileAttachment" required>
            <span class="file-note">* 한 번에 1개 파일(zip, pdf, ipynb, py 등)만 업로드 가능합니다. (최대 50MB)</span>
        </div>

        <!-- 5. 활동 소감 -->
        <div class="form-group">
            <label for="reflection">활동 소감<span>*</span></label>
            <textarea id="reflection" placeholder="이번 활동을 통해 느낀 점이나 인공지능/정보과학적 관점에서의 성찰을 작성하세요." required></textarea>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" id="submitBtn" class="btn-submit">활동 결과 제출하기</button>
    </form>
</div>

<script>
    // ⚠️ 중요: 이전에 생성한 구글 앱스 스크립트(GAS) 배포 URL을 여기에 꼭 넣어주세요!
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby50lB_GV0zXh731Ax5aGopdK7cReOCwSYfK8h29-Vr9jcXiejMzIvARrrWMMHCZ24r/exec";

    function handleSubmit(event) {
        event.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const fileInput = document.getElementById('fileAttachment');
        const file = fileInput.files[0];

        if (!file) {
            alert("파일을 첨부해주세요.");
            return;
        }

        const maxFileSize = 50 * 1024 * 1024; 
        if (file.size > maxFileSize) {
            alert("파일 크기가 너무 큽니다. 50MB 이하의 파일만 제출 가능합니다.");
            return;
        }

        submitBtn.disabled = true;
        loading.style.display = 'flex';

        const reader = new FileReader();
        reader.onload = function(e) {
            const fileData = e.target.result.split(',')[1];

            const payload = {
                studentInfo: document.getElementById('studentInfo').value,
                career: document.getElementById('career').value,
                webtoonSummary: document.getElementById('webtoonSummary').value,
                problemDefinition: document.getElementById('problemDefinition').value,
                reflection: document.getElementById('reflection').value,
                filename: file.name,
                mimeType: file.type,
                fileData: fileData
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                
                if(result.result === 'success') {
                    alert(`${payload.studentInfo} 학생의 제출이 성공적으로 완료되었습니다!`);
                    document.getElementById('activityForm').reset();
                } else {
                    alert("제출 중 오류가 발생했습니다: " + result.error);
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                console.error('Error:', error);
                alert("네트워크 통신 오류가 발생했습니다. 다시 시도해주세요.");
            });
        };

        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
