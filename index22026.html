<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고2 석식 보안 출석체크</title>
    <style>
        /* 상단 무지개 애니메이션 바 */
        .live-auth-bar {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 12px;
            background: linear-gradient(90deg, #ff2400, #e81d1d, #e8b71d, #1de840, #1ddde8, #2b1de8, #dd00f3);
            background-size: 200% 100%;
            z-index: 100000;
            animation: flowing 2s linear infinite;
        }
        @keyframes flowing { 0% { background-position: 0% 0%; } 100% { background-position: -200% 0%; } }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0; padding: 40px 20px;
            background-color: #f0f2f5;
            user-select: none; -webkit-user-select: none;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: #1a73e8; font-size: 1.6rem; margin-bottom: 5px; cursor: pointer; }
        .sub-title { text-align: center; color: #5f6368; margin-bottom: 20px; }

        .live-time {
            text-align: center; font-size: 1.2rem; color: #4285f4;
            font-weight: bold; margin-bottom: 20px;
            background: #e8f0fe; padding: 12px; border-radius: 10px;
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            padding: 16px; font-size: 1.3rem; border: 2px solid #dadce0;
            border-radius: 10px; text-align: center; outline: none;
        }
        input:focus { border-color: #1a73e8; }
        
        button#checkBtn {
            padding: 16px; background: #1a73e8; color: white;
            font-size: 1.2rem; font-weight: bold; border: none;
            border-radius: 10px; cursor: pointer; transition: background 0.2s;
        }
        button:disabled { background: #bdc1c6; cursor: not-allowed; }

        .message-box {
            display: none; padding: 25px 20px; border-radius: 12px;
            text-align: center; font-size: 1.3rem; font-weight: bold; line-height: 1.6;
            position: relative; overflow: hidden;
        }
        .msg-success { background: #e6f4ea; color: #137333; border: 2px solid #81c995; }
        .msg-fail { background: #fce8e6; color: #c5221f; border: 2px solid #f28b82; }

        .scan-badge {
            margin-top: 15px; background: #137333; color: white; padding: 15px;
            border-radius: 10px; font-size: 1.8rem; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.03); } }

        #blackout {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff; z-index: 999999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-size: 1.5rem;
        }

        .status-zone {
            margin-top: 30px; text-align: center; font-size: 0.85rem; color: #137333; font-weight: bold;
            background: #e6f4ea; padding: 10px; border-radius: 8px;
        }

        /* 🔒 교사용 비밀 업로드 패널 (기본 숨김) */
        #adminPanel {
            display: none; margin-top: 20px; padding: 20px;
            border: 2px dashed #4285f4; border-radius: 10px; background: #f8f9fa;
        }
        @media print { body { display: none; } }
    </style>
</head>
<body oncontextmenu="return false">

<div class="live-auth-bar"></div>

<div id="blackout">
    <div>⚠️ 보안 위험 감지 (화면 잠금)</div>
    <p style="font-size: 1rem; color: #ccc;">창 이탈이 감지되어 데이터가 보호 모드로 전환되었습니다.<br>화면을 클릭하면 다시 초기화됩니다.</p>
</div>

<div class="container">
    <h1 onclick="triggerAdmin()">석식 출석 체크</h1>
    <div class="sub-title">고등학교 2학년 (<span id="todayDate"></span>)</div>

    <div class="live-time" id="clock">00:00:00</div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="학번(5자리) 또는 이름 입력" autocomplete="off" disabled>
        <button id="checkBtn" onclick="runProcess()" disabled>명렬표 동기화 중...</button>
    </div>

    <div id="msg" class="message-box"></div>

    <div class="status-zone">
        <span id="dbStatus">🔄 구글 서버에서 명렬표를 가져오는 중입니다...</span>
    </div>

    <div id="adminPanel">
        <h3 style="margin-top:0; color:#4285f4;">⚙️ 교사용 마스터 명렬표 등록</h3>
        <p style="font-size:0.8rem; color:#666;">구글 시트에서 다운로드한 CSV 파일을 선택해 주세요.</p>
        <input type="file" id="csvFile" accept=".csv" style="font-size:0.85rem;">
    </div>
</div>

<script>
    // 1. 🔗 여기에 구글 시트 웹 앱 URL 주소를 꼭 넣어주세요!
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz13JSxZhPsp5H40TVOP2iFOjuO6w8gmASlHW3bfIp6ptfLWniKuCWpI12FzMOgUcAYww/exec";

    let students = [];
    let liveTimeStr = "";
    let currentDayName = "";
    let clickCount = 0; // 비밀번호 창 유도용 카운터
    
    // 글로벌 날짜 및 기록 변수 선언
    let today = "";
    let recordKey = "";
    let records = {};
    const weekDays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

    // 실시간 시간 및 날짜 체크 함수 (1초마다 동시 갱신)
    function updateClockAndDate() {
        const now = new Date();
        
        // 1) 날짜 실시간 체크 및 반영
        const currentToday = now.toISOString().split('T')[0];
        if (today !== currentToday) {
            today = currentToday;
            document.getElementById('todayDate').innerText = today;
            
            // 날짜 변경 시 실시간으로 로컬 스토리지 키와 기록 초기화/로드
            recordKey = `DINNER_REC_${today}`;
            records = JSON.parse(localStorage.getItem(recordKey)) || {};
        }

        // 2) 요일 실시간 업데이트
        currentDayName = weekDays[now.getDay()];

        // 3) 시간 실시간 업데이트
        liveTimeStr = now.toLocaleTimeString();
        document.getElementById('clock').innerText = liveTimeStr;
        
        const activeClock = document.getElementById('scanClock');
        if (activeClock) activeClock.innerText = liveTimeStr;
    }

    // 초기 즉시 실행 후 1초마다 루프 작동
    updateClockAndDate();
    setInterval(updateClockAndDate, 1000);

    // 구글 시트 데이터 원격 다운로드
    window.onload = async () => {
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getStudents`);
            const data = await response.json();
            
            if(data && data.length > 0) {
                students = data;
                document.getElementById('dbStatus').innerText = `🟢 석식 시스템 활성화 완료`;
                document.getElementById('userInput').disabled = false;
                document.getElementById('checkBtn').disabled = false;
                document.getElementById('checkBtn').innerText = "대상자 확인 및 출석";
            } else {
                document.getElementById('dbStatus').innerText = `⚠️ 등록된 명렬표가 없습니다. 제목을 클릭해 등록하세요.`;
            }
        } catch (e) {
            document.getElementById('dbStatus').innerText = `❌ 서버 연결 실패 (인터넷 상태 확인 필요)`;
        }
    };

    // 🔒 교사용 비밀 관리자 창 열기 함수
    function triggerAdmin() {
        clickCount++;
        if (clickCount >= 3) { // 상단 제목을 연속 3번 누르면
            clickCount = 0;
            const password = prompt("관리자 비밀번호를 입력하세요:");
            if (password === "1234") { // 비밀번호 설정
                document.getElementById('adminPanel').style.display = 'block';
                alert("교사용 마스터 인증 성공! 하단에 업로드 창이 활성화되었습니다.");
            } else if (password !== null) {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }
    }

    // 교사용 명렬표 CSV 구글 시트 원격 업로드
    document.getElementById('csvFile').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const lines = ev.target.result.split(/\r?\n/);
            let uploadData = [];
            
            lines.forEach((line, i) => {
                const cols = line.split(',');
                if (i > 0 && cols.length >= 2) {
                    const id = cols[0].trim();
                    const name = cols[1].trim();
                    if (id.length === 5) uploadData.push({ id, name });
                }
            });

            if(uploadData.length === 0) return alert('올바른 학번,이름 포맷의 CSV가 아닙니다.');
            document.getElementById('dbStatus').innerText = `📤 구글 시트에 마스터 데이터 저장 중...`;
            
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "setMaster", data: uploadData })
                });
                alert('🎉 마스터 명렬표가 구글 시트에 저장되었습니다!\n이제 모든 학생 화면에 자동 적용됩니다.');
                location.reload();
            } catch(err) {
                alert('업로드 실패! Apps Script 권한을 확인하세요.');
            }
        };
        reader.readAsText(e.target.files[0], 'EUC-KR');
    };

    // 보안 및 전송 로직
    const blackout = document.getElementById('blackout');
    const msgBox = document.getElementById('msg');
    const inputField = document.getElementById('userInput');

    function resetScreen() { inputField.value = ""; msgBox.innerHTML = ""; msgBox.style.display = 'none'; }
    window.onblur = () => { resetScreen(); blackout.style.display = 'flex'; };
    window.onfocus = () => setTimeout(() => blackout.style.display = 'none', 300);
    document.onclick = () => blackout.style.display = 'none';

    async function sendWithRetry(payload, maxRetries = 3, delay = 500) {
        for (let i = 0; i < maxRetries; i++) {
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                return true;
            } catch (err) {
                if (i < maxRetries - 1) await new Promise(res => setTimeout(res, delay));
            }
        }
        return false;
    }

    async function runProcess() {
        const input = inputField.value.trim();
        const btn = document.getElementById('checkBtn');
        if (!input) return;

        const found = students.find(s => s.id === input || s.name === input);
        if (found) {
            if (records[found.id]) {
                msgBox.className = "message-box msg-fail";
                msgBox.innerHTML = `⚠️ 이미 출석 완료되었습니다.<br>[${found.id} ${found.name}]<br>${records[found.id]}`;
                msgBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = "기록 중...";

            const payload = { action: "attendance", studentId: found.id, name: found.name, timeStr: liveTimeStr, dateStr: today };
            const isSuccess = await sendWithRetry(payload);

            if (isSuccess) {
                records[found.id] = liveTimeStr;
                localStorage.setItem(recordKey, JSON.stringify(records));

                msgBox.className = "message-box msg-success";
                msgBox.innerHTML = `
                    🎉 석식 대상 확인 완료<br>
                    <b>[${found.id} ${found.name}]</b><br>
                    <div class="scan-badge">
                        <div>${currentDayName}</div>
                        <div id="scanClock" style="font-size: 1.4rem; margin-top: 5px; font-weight: normal;">${liveTimeStr}</div>
                    </div>
                `;
                msgBox.style.display = 'block';
                inputField.value = "";
            } else {
                alert('⚠️ 통신 지연 발생. 다시 시도해 주세요.');
            }
            btn.disabled = false;
            btn.innerText = "대상자 확인 및 출석";
        } else {
            msgBox.className = "message-box msg-fail";
            msgBox.innerHTML = `❌ 석식 대상자가 아닙니다.<br>학번이나 이름을 확인하세요.`;
            msgBox.style.display = 'block';
        }
    }
    inputField.onkeyup = (e) => { if(e.key === 'Enter') runProcess(); };
</script>
</body>
</html>
