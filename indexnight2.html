<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>야간 자율학습 출석</title>

    <style>

        body{
            font-family:'Malgun Gothic',sans-serif;
            background:#f4f7f6;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            width:320px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        h2{
            margin-bottom:20px;
        }

        input,button{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:8px;
            box-sizing:border-box;
            font-size:18px;
        }

        input{
            text-align:center;
        }

        button{
            background:#0984e3;
            color:white;
            border:none;
            cursor:pointer;
            font-weight:bold;
        }

        button:disabled{
            background:#b2bec3;
            cursor:not-allowed;
        }

        #msg{
            margin-top:15px;
            font-weight:bold;
            min-height:24px;
            white-space:pre-line;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>야간 자율학습 출석</h2>

    <form id="frm">

        <input
            type="text"
            name="studentInfo"
            placeholder="학번 또는 이름 입력"
            required
            autocomplete="off"
        >

        <button type="submit" id="btn">
            출석
        </button>

    </form>

    <div id="msg"></div>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxZfMrdVxcfkqgj9yOAtqnHdm_w7I-VrE8TK6ctCJmfE7hwaHyUzG8v_n5DbJqZBQnr/exec";

document.getElementById('frm').onsubmit = function(e){

    e.preventDefault();

    const form = this;

    const btn = document.getElementById('btn');

    const msg = document.getElementById('msg');

    const input = form.querySelector("input");

    // 입력 잠금
    btn.disabled = true;

    input.readOnly = true;

    btn.innerText = "처리 중...";

    msg.innerText = "";

    fetch(URL, {

        method : 'POST',

        body : new FormData(form)

    })

    .then(res => res.json())

    .then(data => {

        // 성공
        if(data.status === "success"){

            msg.style.color = "green";

            msg.innerText = data.message;

            form.reset();
        }

        // 중복 출석
        else if(data.status === "duplicate"){

            msg.style.color = "red";

            msg.innerText = data.message;
        }

        // 기타 오류
        else{

            msg.style.color = "red";

            msg.innerText = data.message || "오류 발생";
        }

    })

    .catch(error => {

        msg.style.color = "red";

        msg.innerText = "서버 연결 오류";

        console.error(error);
    })

    .finally(() => {

        btn.disabled = false;

        input.readOnly = false;

        btn.innerText = "출석";
    });

};

</script>

</body>

</html>
